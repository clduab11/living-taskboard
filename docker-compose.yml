version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: living-taskboard-postgres
    environment:
      POSTGRES_USER: taskboard
      POSTGRES_PASSWORD: taskboard_dev_password
      POSTGRES_DB: living_taskboard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - taskboard-network

  redis:
    image: redis:7-alpine
    container_name: living-taskboard-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - taskboard-network

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: living-taskboard-backend
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://taskboard:taskboard_dev_password@postgres:5432/living_taskboard
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your-jwt-secret-change-in-production
      CLAUDE_API_KEY: ${CLAUDE_API_KEY}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./apps/backend:/app/apps/backend
      - ./packages:/app/packages
      - /app/node_modules
    networks:
      - taskboard-network

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: living-taskboard-frontend
    environment:
      VITE_API_URL: http://localhost:3001
      VITE_WS_URL: ws://localhost:3001
    ports:
      - "5173:5173"
    volumes:
      - ./apps/frontend:/app/apps/frontend
      - ./packages:/app/packages
      - /app/node_modules
    networks:
      - taskboard-network

volumes:
  postgres_data:
  redis_data:

networks:
  taskboard-network:
    driver: bridge
